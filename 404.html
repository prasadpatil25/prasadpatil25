<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>|404⟩ — state not found · Prasad Patil</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#F7F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E16" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Instrument+Sans:wght@400;500&family=Spline+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F6F1; --ink:#13131B; --mut:#585866; --dim:#9C9CAB; --hair:#E5E3DA;
    --grad:linear-gradient(100deg,#4FE0C0,#7B9BFF 38%,#C77DFF 72%,#FF9BC5);
    --fd:"Syne"; --fb:"Instrument Sans"; --fm:"Spline Sans Mono";
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  @media (prefers-color-scheme: dark){
    :root{--paper:#0E0E16; --ink:#ECEBF5; --mut:#A6A4BA; --dim:#69677E; --hair:#262639;}
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--fb),system-ui,sans-serif; display:grid; place-items:center; padding:32px; text-align:center;
    background-image:radial-gradient(var(--hair) 1px, transparent 1px); background-size:28px 28px;}
  a{color:inherit; text-decoration:none;}
  .ket{font-family:var(--fd); font-weight:800; font-size:clamp(3.4rem,13vw,7.5rem); letter-spacing:-.03em; line-height:1; margin:0 0 6px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .lab{font-family:var(--fm); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--mut); margin:0 0 26px;}
  h1{font-family:var(--fd); font-weight:600; font-size:clamp(1.3rem,3.6vw,1.9rem); letter-spacing:-.015em; margin:0 0 14px;}
  p{color:var(--mut); max-width:44ch; margin:0 auto 30px; line-height:1.6;}
  .go{display:inline-flex; align-items:center; gap:9px; font-family:var(--fm); font-size:.82rem;
    padding:12px 22px; border-radius:999px; background:var(--ink); color:var(--paper); transition:.24s var(--ease);}
  .go:hover{transform:translateY(-2px); box-shadow:0 16px 34px -16px rgba(19,19,27,.5);}
  svg{width:14px; height:14px;}
</style>
</head>
<body>
  <main>
    <p class="ket">|404&#10217;</p>
    <p class="lab">state not found</p>
    <h1>This page collapsed to a basis state that doesn't exist.</h1>
    <p>The measurement returned nothing. Which is a fancy way of saying: bad link, moved file, or a typo in the URL.</p>
    <a class="go" href="./">Return to a valid state
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </main>
</body>
</html>
